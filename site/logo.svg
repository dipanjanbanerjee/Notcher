<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#231c4d"/>
      <stop offset="1" stop-color="#0b0a17"/>
    </linearGradient>
    <linearGradient id="ink" x1="290" y1="0" x2="734" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffbe5c"/>
      <stop offset="0.5" stop-color="#ff5f8f"/>
      <stop offset="1" stop-color="#9b6bff"/>
    </linearGradient>
    <filter id="glow" filterUnits="userSpaceOnUse" x="40" y="40" width="944" height="944">
      <feGaussianBlur stdDeviation="46"/>
    </filter>
    <clipPath id="tile"><rect x="40" y="40" width="944" height="944" rx="236"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect x="40" y="40" width="944" height="944" fill="url(#bg)"/>
    <!-- One unbroken wave that writes an N: up, over, down, under, up. -->
    <path d="M 312 708 V 430 C 312 290 452 280 494 400 L 530 620 C 572 744 712 734 712 594 V 316"
          fill="none" stroke="url(#ink)" stroke-width="104" stroke-linecap="round" stroke-linejoin="round"
          filter="url(#glow)" opacity="0.6"/>
    <path d="M 312 708 V 430 C 312 290 452 280 494 400 L 530 620 C 572 744 712 734 712 594 V 316"
          fill="none" stroke="url(#ink)" stroke-width="104" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
