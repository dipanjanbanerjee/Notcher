  </defs>
  <rect x="64" y="64" width="896" height="896" rx="216" fill="url(#bg)"/>
  <rect x="64.5" y="64.5" width="895" height="895" rx="215.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>
  <!-- the island: hangs from the top edge with flared shoulders -->
  <g transform="translate(512 0)">
    <path d="M -250 210 L 250 210 Q 220 210 220 250 L 220 330 C 220 382 194 408 142 408 L -142 408 C -194 408 -220 382 -220 330 L -220 250 Q -220 210 -250 210 Z"
          fill="none" stroke="url(#glow)" stroke-width="22" filter="url(#blur)" opacity="0.9"/>
    <path d="M -250 210 L 250 210 Q 220 210 220 250 L 220 330 C 220 382 194 408 142 408 L -142 408 C -194 408 -220 382 -220 330 L -220 250 Q -220 210 -250 210 Z"
          fill="#000"/>
    <path d="M -250 210 L 250 210 Q 220 210 220 250 L 220 330 C 220 382 194 408 142 408 L -142 408 C -194 408 -220 382 -220 330 L -220 250 Q -220 210 -250 210 Z"
          fill="none" stroke="url(#glow)" stroke-width="6" opacity="0.9"/>
    <circle cx="-138" cy="309" r="42" fill="url(#glow)"/>
    <rect x="86" y="292" width="16" height="44" rx="8" fill="#00e0c0"/>
    <rect x="114" y="270" width="16" height="66" rx="8" fill="#00e0c0" opacity="0.85"/>
    <rect x="142" y="300" width="16" height="36" rx="8" fill="#00e0c0" opacity="0.7"/>
  </g>
