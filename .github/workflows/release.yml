name: Release

# Publishes a GitHub release for the version in src-tauri/tauri.conf.json, tagged
# vX.Y.Z, when that version has no release yet. It runs when the version changes on
# main, when a vX.Y.Z tag is pushed, or by hand from the Actions tab.
on:
  push:
    branches: [main]
    paths: ["src-tauri/tauri.conf.json", ".github/workflows/release.yml"]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Work out the version to release
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the app version $tag"
            exit 1
          fi
          if draft=$(gh release view "$tag" --json isDraft -q .isDraft 2>/dev/null); then
            if [ "$draft" = "true" ]; then
              # An earlier run failed half way (GitHub errors can leave a draft behind).
              echo "Removing the unfinished draft of $tag and publishing it again."
              gh release delete "$tag" --yes
            else
              echo "$tag is already released; nothing to do."
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Build installers
        if: steps.version.outputs.skip != 'true'
        run: npx tauri build --bundles nsis,msi
      - name: Publish the release
        if: steps.version.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          bundle=src-tauri/target/release/bundle
          # A copy with a fixed name, so "latest/download/Notcher-Setup.exe" always works.
          cp "$bundle"/nsis/*-setup.exe Notcher-Setup.exe
          notes="docs/releases/$TAG.md"
          if [ -f "$notes" ]; then set -- --notes-file "$notes"; else set -- --generate-notes; fi
          # Creates the tag on this commit if it doesn't exist yet. GitHub sometimes
          # answers with a server error; try again, clearing any half-made draft first.
          for attempt in 1 2 3; do
            if gh release create "$TAG" --target "$GITHUB_SHA" --title "Notcher $TAG" "$@" \
              Notcher-Setup.exe "$bundle"/nsis/*.exe "$bundle"/msi/*.msi; then
              exit 0
            fi
            echo "Publishing failed (attempt $attempt); retrying."
            if [ "$(gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null)" = "true" ]; then
              gh release delete "$TAG" --yes
            fi
            sleep $((attempt * 20))
          done
          exit 1
