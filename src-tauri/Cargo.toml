[package]
name = "notcher"
version = "0.4.0"
description = "A fluid island at the top of your screen"
authors = ["Dipanjan Banerjee"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "notcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-store = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
base64 = "0.22"
raw-window-handle = "0.6"
rusqlite = { version = "0.41", features = ["bundled"] }
sysinfo = { version = "0.40", default-features = false, features = ["system", "disk", "network"] }
arboard = { version = "3", default-features = false, features = ["image-data", "wayland-data-control"] }
png = "0.18"
tiny_http = "0.12"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
getrandom = "0.3"
tauri-plugin-dialog = "2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
gtk-layer-shell = { version = "0.8", features = ["v0_6"] }
mpris = "2"
x11rb = { version = "0.13", features = ["randr", "xfixes"] }
url = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "ApplicationModel",
  "Foundation",
  "Foundation_Collections",
  "Media_Control",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_System_DataExchange",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_System_WinRT",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "UI_Notifications",
  "UI_Notifications_Management",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
